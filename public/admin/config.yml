  # =========================================================================
  # 3. Le nostre partenze
  # =========================================================================
  - name: departures
    label: 'Le nostre partenze'
    label_singular: 'Partenza'
    icon: tour
    folder: src/content/departures
    format: frontmatter
    extension: md
    create: true
    i18n: true
    slug: '{{fields.slug}}'
    identifier_field: title
    summary: '{{title}} — {{departureDate}}'
    sortable_fields: [departureDate, title, order]
    view_groups:
      - { label: 'Stato', field: status }
      - { label: 'Categoria', field: category }
    fields:
      - { label: 'Titolo del viaggio', name: 'title', widget: 'string', i18n: true }
      - {
          label: 'Indirizzo della pagina',
          name: 'slug',
          widget: 'string',
          i18n: true,
          hint: 'Solo minuscole e trattini. Cambiandolo cambia il link: i vecchi link smettono di funzionare.',
        }
      - {
          label: 'Stato',
          name: 'status',
          widget: 'select',
          i18n: duplicate,
          default: open,
          options:
            [
              { label: 'Aperta', value: open },
              { label: 'Ultimi posti', value: few-places },
              { label: 'Completa', value: sold-out },
              { label: 'Bozza (non pubblicata)', value: draft },
            ],
        }
      - { label: 'In evidenza', name: 'featured', widget: 'boolean', default: false, i18n: duplicate }
      - {
          label: 'Ordine',
          name: 'order',
          widget: 'number',
          value_type: int,
          default: 0,
          i18n: duplicate,
          hint: 'Numero più alto = più in alto nell’elenco. A parità di numero contano le date.',
        }
      - { label: 'Riassunto (compare nella scheda)', name: 'summary', widget: 'text', i18n: true }
      - {
          label: 'Categoria',
          name: 'category',
          widget: 'string',
          i18n: true,
          hint: 'Es. “Crociere fluviali”, “Tour culturali”. Le categorie diventano i filtri dell’elenco.',
        }
      - { label: 'Città e tappe', name: 'destinations', widget: 'list', i18n: true, field: { label: 'Tappa', name: 'item', widget: 'string' } }
      - { label: 'Paesi', name: 'countries', widget: 'list', i18n: true, field: { label: 'Paese', name: 'item', widget: 'string' } }
      - { label: 'Data di partenza', name: 'departureDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, i18n: duplicate }
      - { label: 'Data di rientro', name: 'returnDate', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, picker_utc: true, i18n: duplicate }
      - { label: 'Durata in giorni', name: 'durationDays', widget: 'number', value_type: int, i18n: duplicate }
      - { label: 'Notti', name: 'durationNights', widget: 'number', value_type: int, required: false, i18n: duplicate }
      - { label: 'Partenze da', name: 'departsFrom', widget: 'list', i18n: true, field: { label: 'Città', name: 'item', widget: 'string' } }
      - { label: 'Prezzo da', name: 'priceFrom', widget: 'number', value_type: int, required: false, i18n: duplicate }
      - { label: 'Valuta', name: 'currency', widget: 'select', options: [EUR, CHF], default: EUR, i18n: duplicate }
      - { label: 'Nota sul prezzo', name: 'priceNote', widget: 'text', required: false, i18n: true }
      - label: 'Immagine principale'
        name: heroImage
        widget: object
        required: false
        fields:
          - { label: 'File', name: 'src', widget: 'image', required: false, i18n: duplicate }
          - { label: 'Testo alternativo', name: 'alt', widget: 'string', required: false, i18n: true }
          - { label: 'Brief fotografico', name: 'brief', widget: 'text', required: false, i18n: true }
      - label: 'Galleria'
        name: gallery
        widget: list
